<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stack</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stack">
<style>
:root{--bg:#0b0b0c;--card:#151517;--bd:#26262a;--fg:#e8e8ea;--mut:#8a8a92;--acc:#4c8dff;--warn:#ff5c5c;--ok:#35c46a;--oil:#f5a524;--nav:#121214}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 76px)}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;font-weight:600;margin:0 0 2px}.sub{font-size:12px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:12px;font-weight:600;margin:0 0 10px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
.row{display:grid;gap:8px;margin-bottom:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
label{font-size:11px;color:var(--mut);display:block;margin-bottom:3px}
input,select{width:100%;background:#1d1d20;color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:9px;font-size:14px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--acc)}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:14px;font-weight:600}
.btn.sec{background:#232326;color:var(--fg)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.x{background:transparent;border:none;color:var(--mut);font-size:17px;padding:2px 6px}
.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);align-items:flex-start}
.item:last-child{border-bottom:none}.item .b{flex:1;min-width:0}
.item.done .b{opacity:.42}.item.done .nm{text-decoration:line-through}
.item.off .b{opacity:.4}
.nm{font-weight:600;font-size:14px}.meta{font-size:12px;color:var(--mut);margin-top:2px}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:99px;background:#232326;color:var(--mut);margin-left:5px}
.u{font-weight:700;font-size:14px;color:var(--fg)}
.tl{border-left:2px solid var(--bd);margin-left:6px}
.ev{position:relative;padding:0 0 14px 16px}
.ev:before{content:'';position:absolute;left:-6px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--bd)}
.ev.rx:before{background:var(--ok)}.ev.pin:before{background:var(--acc)}.ev.iso:before{background:var(--oil)}.ev.supp:before{background:#a855f7}
.tm{font-size:12px;font-weight:600;color:var(--mut)}
.warn{color:var(--warn)}.ok{color:var(--ok)}.empty{color:var(--mut);font-size:13px;padding:8px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:11px;color:var(--mut);font-weight:600;padding:6px;border-bottom:1px solid var(--bd)}
td{padding:8px 6px;border-bottom:1px solid var(--bd);vertical-align:top}tr:last-child td{border-bottom:none}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.editb{background:#1d1d20;border:1px solid var(--acc);border-radius:12px;padding:14px;margin-bottom:12px}
.chk{flex:0 0 30px;width:30px;height:30px;border-radius:9px;border:2px solid var(--bd);background:transparent;color:transparent;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#0b0b0c}
.pz{flex:0 0 26px;width:26px;height:26px;border-radius:7px;border:1px solid var(--bd);background:transparent;color:var(--mut);font-size:12px;padding:0;display:flex;align-items:center;justify-content:center}
.pz.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.dy{width:32px;height:32px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--mut);font-size:12px;padding:0;font-family:inherit}
.dy.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--bd);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{font-size:10px;color:var(--mut);text-align:center;padding:4px 0;font-weight:600}
.cell{aspect-ratio:1;border:1px solid var(--bd);border-radius:8px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;font-family:inherit;color:var(--fg);font-size:11px}
.cell.blank{border:none}.cell.today{border-color:var(--acc);background:#1a2436}.cell.sel{border-color:var(--fg)}
.cell .dn{font-weight:600;font-size:11px}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.dot.oral{background:var(--ok)}.dot.oil{background:var(--oil)}.dot.one{background:#a855f7}
.dot.rare{width:7px;height:7px;box-shadow:0 0 0 1.5px var(--bg),0 0 0 2.5px currentColor}
.bodyfig{display:flex;gap:10px;justify-content:center;margin:8px 0}
.site{fill:#232326;stroke:#3a3a40;stroke-width:2;cursor:pointer}
.site.fresh{fill:#ff5c5c;stroke:#ff8a8a}.site.mid{fill:#f5a524;stroke:#ffc76b}.site.ready{fill:#35c46a;stroke:#6fe39a}
.legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--mut);margin-top:6px}
.lg{display:flex;align-items:center;gap:4px}.lgc{width:9px;height:9px;border-radius:50%}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:9}
.nb{flex:1;background:none;border:none;color:var(--mut);font-size:10px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.nb.on{color:var(--acc)}
.nb i{font-size:17px;font-style:normal;line-height:1}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.s{background:#1a1a1d;border-radius:10px;padding:10px;text-align:center}
.sv{font-size:20px;font-weight:600}.sl{font-size:10px;color:var(--mut)}
.chart{width:100%;display:block}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#1a1a1d}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .dt{position:absolute;bottom:0;left:0;right:0;font-size:9.5px;padding:3px 5px;background:rgba(0,0,0,.65);color:#fff}
.ph .dl{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:6px;font-size:12px;width:20px;height:20px;line-height:1}
.mk{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.mk:last-child{border-bottom:none}
.mk .b{flex:1;min-width:0}
.v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.v.hi{color:var(--warn)}.v.lo{color:var(--oil)}.v.in{color:var(--ok)}
.more{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.more button{background:#1d1d20;border:1px solid var(--bd);border-radius:10px;padding:16px 10px;color:var(--fg);font-size:13.5px;font-family:inherit;font-weight:500;text-align:left}
</style>
</head>
<body>

<h1 id="ttl">Stack</h1>

<script>

const ROUTE=[['subq','SubQ'],['im','IM'],['iv','IV'],['oral','Oral'],['nasal','Nasal']];
const FREQ=[['daily','Daily'],['bid','2x daily'],['eod','Every other day'],['2xw','2x / wk'],['3xw','3x / wk'],['weekly','Weekly'],['custom','Custom days'],['prn','As needed']];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const SITES=['Abdomen L','Abdomen R','Thigh L','Thigh R','Glute L','Glute R','Delt L','Delt R'];
const MARKS=[['hct','Hematocrit','%',38.8,50,'Donate above 52%'],['e2','Estradiol','pg/mL',10,40,'Crashed E2 wrecks erections'],['prl','Prolactin','ng/mL',4,15.2,'High = ED'],['psa','PSA','ng/mL',0,4,'Baseline matters at 52'],['tt','Total testosterone','ng/dL',264,916,''],['ft','Free testosterone','pg/mL',50,224,''],['shbg','SHBG','nmol/L',16,55,''],['tsh','TSH','mIU/L',0.45,4.5,''],['ft4','Free T4','ng/dL',0.82,1.77,''],['a1c','HbA1c','%',4,5.6,'GLP-1 moves this'],['glu','Fasting glucose','mg/dL',70,99,''],['ins','Fasting insulin','uIU/mL',2,19,''],['ldl','LDL','mg/dL',0,100,'Oils push this'],['hdl','HDL','mg/dL',40,100,''],['trig','Triglycerides','mg/dL',0,150,''],['alt','ALT','U/L',7,56,'Orals raise this'],['ast','AST','U/L',10,40,''],['creat','Creatinine','mg/dL',0.7,1.3,'Creatine raises this'],['crp','hs-CRP','mg/L',0,3,''],['vitd','Vitamin D','ng/mL',30,100,''],['ferr','Ferritin','ng/mL',30,400,''],['igf','IGF-1','ng/mL',75,216,'Tesamorelin raises this'],['b12','B12','pg/mL',200,900,'']];
const cN=i=>(CLS.find(c=>c[0]===i)||['','Other'])[1];
const rN=i=>(ROUTE.find(c=>c[0]===i)||['',''])[1];
const fN=i=>(FREQ.find(c=>c[0]===i)||['',''])[1];
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const t0=()=>new Date().toISOString().slice(0,10);
const conc=c=>c.bac>0?c.mg/c.bac:0;
const vol=(c,d)=>{const k=conc(c);return k>0?d/k:0;};
const un=(c,d)=>vol(c,d)*100;
const mgLbl=d=>d<1?(+(d*1000).toFixed(1))+' mcg':d+' mg';
const doseLbl=c=>`<span class="u">${un(c,c.dose).toFixed(1)} units</span> <span class="meta">(${mgLbl(c.dose)})</span>`;
const dayStr=c=>(c.days&&c.days.length)?' · '+c.days.map(d=>DAYS[d]).join('/'):'';
const pins=c=>(!c.route||c.route==='oral')?0:(c.freq==='daily'?7:c.freq==='bid'?14:c.freq==='eod'?3.5:c.freq==='2xw'?2:c.freq==='3xw'?3:c.freq==='weekly'?1:(c.days||[]).length);
const live=c=>c.status==='active'&&!c.paused;
let SY={token:'',gist:'',auto:false,last:''};
try{SY=Object.assign(SY,JSON.parse(localStorage.getItem(SYK)||'{}'));}catch(e){}
function saveSY(){localStorage.setItem(SYK,JSON.stringify(SY));}
let S=load();
function mk(n,cls,route,mg,bac,dose,f,t,t2,site,note){
const days=f==='2xw'?[1,4]:f==='3xw'?[1,3,5]:[];
return{id:uid(),name:n,cls:cls,route:route,mg:mg,bac:bac,dose:dose,freq:f,days:days,time:t,time2:t2||'',site:site,note:note||'',start:t0(),used:0,status:'active',paused:false};}
function sp(n,dose,t,note,on){return{id:uid(),name:n,cls:'supp',dose:dose,freq:'daily',time:t,note:note||'',start:t0(),on:!!on};}
function fresh(){return{tab:'today',editing:null,calMonth:0,selDay:null,logDate:null,done:{},sites:{},weight:[],labs:[],oneoffs:[],compounds:[
mk('NAD+','nad','subq',1200,12,25,'2xw','07:30','','Abdomen L','Pin early, not at night.'),
mk('BPC-157','heal','subq',10,2,0.25,'bid','08:00','20:00','Abdomen R','250-500mcg 2x/day.'),
mk('GHK-Cu','skin','subq',50,3,1,'daily','20:00','','Thigh L','Combined cartridge with BPC. 30 on / 30 off.'),
mk('Thymosin a-1','heal','subq',10,2,1.6,'2xw','08:00','','Glute R','1.6mg 2x/wk.'),
mk('Glutathione','mito','im',1200,6,200,'2xw','08:00','','Delt L','IM. Stings SubQ.'),
mk('hCG','hcg','subq',5000,2,250,'2xw','08:00','','Abdomen L','250iu x2.'),
mk('Tesamorelin','ghs','subq',10,2,1,'daily','21:30','','Thigh R','Fasted, 2h after food.'),
mk('Tirzepatide','glp1','subq',15,1.5,5,'weekly','08:00','','Abdomen R','BRIDGE at 5mg.'),
mk('Test Cyp','aas','im',200,5,75,'2xw','09:00','','Glute L','75mg Mon/Thu.'),
mk('Primo','aas','im',100,10,100,'2xw','09:00','','Glute R','Same barrel as test. Watch E2.'),
mk('KPV','heal','subq',30,3,0.5,'daily','08:00','','Abdomen R','500mcg, 5 on / 2 off.'),
mk('Retatrutide','glp1','subq',60,3,2,'weekly','08:00','','Abdomen L','START 2mg x2wk, then 4mg.'),
mk('TB-500','heal','subq',10,2,2.5,'2xw','08:00','','Glute L','Out of stock.')
],meds:[
{id:uid(),name:'Lisdexamfetamine',cls:'stim',dose:'50 mg',freq:'daily',days:[],time:'07:00',start:t0()},
{id:uid(),name:'Fluoxetine',cls:'ssri',dose:'20 mg',freq:'daily',days:[],time:'08:00',start:t0()},
{id:uid(),name:'Doxycycline',cls:'abx',dose:'100 mg',freq:'daily',days:[],time:'10:00',start:t0()},
{id:uid(),name:'Tadalafil',cls:'pde5',dose:'5 mg',freq:'daily',days:[],time:'08:00',start:t0()},
{id:uid(),name:'Propranolol',cls:'bp',dose:'10-20 mg',freq:'prn',days:[],time:'PRN',start:t0()},
{id:uid(),name:'Sildenafil',cls:'pde5',dose:'50 mg',freq:'prn',days:[],time:'PRN',start:t0()}
],supps:[
sp('Whey isolate','2 scoops (50g)','08:00','Dairy - 2h from doxy.',true),
sp('Creatine monohydrate','5 g','08:00','Raises creatinine.',true),
sp('Electrolytes','1 serving','08:00','Essential on a GLP-1.',true),
sp('Vitamin D3 + K2','4000 IU / 100 mcg','12:00','With fat.',false),
sp('Omega-3','2-3 g EPA/DHA','12:00','With food.',false),
sp('NAC','600 mg','12:00','',false),
sp('Citrus bergamot','500 mg','12:00','',false),
sp('Psyllium husk','5 g','19:00','',false),
sp('Magnesium glycinate','400 mg','21:00','Night, away from doxy.',false),
sp('Zinc','25 mg','21:00','Balances copper.',false),
sp('Multivitamin','1 tab','21:00','Night - binds doxy.',false),
sp('Berberine','500 mg','08:00','Additive with GLP-1.',false),
sp('Taurine','2 g','08:00','',false)
],storage:[
{id:uid(),name:'Thymosin a-1 5 mg',cls:'heal',qty:'1 vial',note:'Recon 1mL so 1.6mg = 32u'},
{id:uid(),name:'Anavar',cls:'oral',qty:'inventory',note:'HOLD 25-50mg'},
{id:uid(),name:'Dianabol',cls:'oral',qty:'inventory',note:'HOLD'},
{id:uid(),name:'Winstrol',cls:'oral',qty:'inventory',note:'HOLD'},
{id:uid(),name:'Clenbuterol',cls:'stim',qty:'inventory',note:'HOLD'},
{id:uid(),name:'Cagrilintide 5 mg',cls:'amylin',qty:'1 vial',note:'Test amylin before Elora'},
{id:uid(),name:'E250 test E 250',cls:'aas',qty:'3 x 10 mL',note:''},
{id:uid(),name:'Mast Prop 100',cls:'aas',qty:'3 x 10 mL',note:'Committed phase'},
{id:uid(),name:'Tren A 100',cls:'aas',qty:'2 x 10 mL',note:'Last push'},
{id:uid(),name:'NPP 100',cls:'aas',qty:'2 x 10 mL',note:''},
{id:uid(),name:'C250',cls:'aas',qty:'3 x 10 mL',note:''},
{id:uid(),name:'S250',cls:'aas',qty:'1 x 10 mL',note:'Confirm ester'},
{id:uid(),name:'YK-11 50 mg/mL',cls:'oral',qty:'1 vial',note:''},
{id:uid(),name:'SLU-PP-32',cls:'mito',qty:'1 vial',note:''},
{id:uid(),name:'Amino The Shredder',cls:'supp',qty:'1 vial',note:''},
{id:uid(),name:'HVY AM Shred',cls:'supp',qty:'2 vials',note:''},

{id:uid(),name:'5-amino-1MQ 100 mg',cls:'mito',qty:'2 vials + caps',note:'Use the caps'},
{id:uid(),name:'Selank 5 mg',cls:'heal',qty:'4 vials',note:''},
{id:uid(),name:'VIP 5.8 mg',cls:'heal',qty:'4 vials',note:''},
{id:uid(),name:'hCG 2000 iu',cls:'hcg',qty:'3 vials',note:''},
{id:uid(),name:'Tirzepatide 15 mg',cls:'glp1',qty:'1 vial',note:'spare'},
{id:uid(),name:'GHK-Cu 50 mg',cls:'skin',qty:'4 vials',note:'spare'},
{id:uid(),name:'Glutathione 1200 mg',cls:'mito',qty:'10+ vials',note:'spare'},
{id:uid(),name:'NAD+ large vial',cls:'nad',qty:'6 vials',note:'VERIFY mg'},

{id:uid(),name:'KPV 30 mg',cls:'heal',qty:'1 kit',note:'incoming'}
]};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);
['compounds','meds','supps','storage','weight','labs','oneoffs'].forEach(k=>p[k]=p[k]||[]);
p.done=p.done||{};p.sites=p.sites||{};
if(p.calMonth===undefined)p.calMonth=0;
p.supps.forEach(s=>{if(s.on===undefined)s.on=false;});
p.compounds.forEach(c=>{if(c.paused===undefined)c.paused=false;
 if((c.freq==='2xw'||c.freq==='3xw'||c.freq==='custom')&&(!c.days||!c.days.length))c.days=c.freq==='2xw'?[1,4]:c.freq==='3xw'?[1,3,5]:[1];});
const cut=new Date(Date.now()-60*864e5).toISOString().slice(0,10);
Object.keys(p.done).forEach(d=>{if(d<cut)delete p.done[d];});
return p;}}catch(e){}return fresh();}
let pushT=null;
function save(){localStorage.setItem(KEY,JSON.stringify(S));
if(SY.auto&&SY.token&&SY.gist){clearTimeout(pushT);pushT=setTimeout(()=>{pushGist(true);},2500);}}
const TITLES={today:'Today',body:'Body',labs:'Labs',sites:'Sites',more:'More',cal:'Calendar',stack:'Stack',supps:'Supps',inv:'Inventory',flags:'Flags',tools:'Tools',plan:'Plan',proto:'Proto'};
function render(){
const prim=['today','body','labs','sites','more'];
document.getElementById('nav').innerHTML=[['today','Today','◉'],['body','Body','▤'],['labs','Labs','◍'],['sites','Sites','◎'],['more','More','≡']].map(n=>`<button class="nb ${S.tab===n[0]||(n[0]==='more'&&!prim.includes(S.tab))?'on':''}" data-tab="${n[0]}"><i>${n[2]}</i>${n[1]}</button>`).join('');
document.getElementById('ttl').textContent=TITLES[S.tab]||'Stack';
const act=S.compounds.filter(live);
document.getElementById('sub').textContent=`${act.length} compounds · ~${Math.round(act.reduce((a,c)=>a+pins(c),0))} pins/wk`;
let html='';
if(S.editing){const it=(S[S.editing.k]||[]).find(x=>x.id===S.editing.id);
if(it)html+=`<div class="editb"><h3 style="font-size:12px;color:var(--mut);margin:0 0 10px;text-transform:uppercase">Edit ${esc(it.name)}</h3>
<div class="row g2"><div><label>Name</label><input id="eN" value="${esc(it.name)}"></div><div><label>Dose</label><input id="eD" value="${esc(it.dose||'')}"></div></div>
<div class="row g2"><div><label>Time</label><input id="eT" type="time" value="${it.time&&it.time!=='PRN'?it.time:'08:00'}"></div><div><label>Frequency</label><select id="eF">${FREQ.map(f=>`<option value="${f[0]}" ${it.freq===f[0]?'selected':''}>${f[1]}</option>`).join('')}</select></div></div>

function occurs(x,d){const s=new Date(x.start+'T00:00:00'),dt=new Date(d+'T00:00:00');if(dt<s)return false;const df=Math.round((dt-s)/864e5);
if(x.freq==='daily'||x.freq==='bid')return true;if(x.freq==='eod')return df%2===0;if(x.freq==='weekly')return df%7===0;
if(x.freq==='2xw'||x.freq==='3xw'||x.freq==='custom')return(x.days||[]).includes(dt.getDay());return false;}
function dayItems(ds,withSupp){
const a=[...S.compounds.filter(c=>live(c)&&occurs(c,ds)).map(x=>({...x,k:'compounds',kind:'pin'})),
...S.meds.filter(m=>m.freq!=='prn'&&occurs(m,ds)).map(x=>({...x,k:'meds',kind:'rx'}))];
if(withSupp)a.push(...S.supps.filter(s=>s.on&&s.freq!=='prn'&&occurs(s,ds)).map(x=>({...x,k:'supps',kind:'supp'})));
return a.sort((x,y)=>String(x.time).localeCompare(String(y.time)));
}

function chart(pts,lo,hi){
if(!pts.length)return '';
const W=320,H=120,P=24;
const vs=pts.map(p=>p.v);const mn=Math.min(...vs,lo),mx=Math.max(...vs,hi);
const sy=v=>H-P-((v-mn)/(mx-mn||1))*(H-2*P);
const sx=i=>P+(i/(Math.max(pts.length-1,1)))*(W-2*P);
const line=pts.map((p,i)=>`${sx(i)},${sy(p.v)}`).join(' ');
return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:130px">
<rect x="0" y="${sy(hi)}" width="${W}" height="${Math.max(sy(lo)-sy(hi),1)}" fill="#35c46a" opacity="0.09"/>
<polyline points="${line}" fill="none" stroke="#4c8dff" stroke-width="2" stroke-linejoin="round"/>
${pts.map((p,i)=>`<circle cx="${sx(i)}" cy="${sy(p.v)}" r="2.6" fill="#4c8dff"/>`).join('')}
</svg>`;
}

async function addPhoto(file){
const img=new Image();const url=URL.createObjectURL(file);
await new Promise(r=>{img.onload=r;img.src=url;});
const max=760;let w=img.width,h=img.height;
if(w>h&&w>max){h=h*max/w;w=max;}else if(h>=w&&h>max){w=w*max/h;h=max;}
const c=document.createElement('canvas');c.width=w;c.height=h;
c.getContext('2d').drawImage(img,0,0,w,h);
const src=c.toDataURL('image/jpeg',0.62);
const db=await idb();const tx=db.transaction('p','readwrite');
tx.objectStore('p').put({id:uid(),d:t0(),src:src});
URL.revokeObjectURL(url);setTimeout(loadPhotos,150);}

function vCal(){
const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+S.calMonth);
const y=base.getFullYear(),m=base.getMonth();
const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();
let cells='';
for(let i=0;i<first;i++)cells+='<div class="cell blank"></div>';
for(let d=1;d<=days;d++){
const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const it=dayItems(ds,false);
const oo=S.oneoffs.filter(o=>o.d===ds);
const rare=it.filter(x=>x.freq==='weekly'||x.freq==='2xw');
const dots=it.slice(0,4).map(x=>`<span class="dot ${x.kind==='rx'?'oral':x.cls==='aas'?'oil':''} ${rare.includes(x)?'rare':''}"></span>`).join('')+(oo.length?'<span class="dot one"></span>':'');
cells+=`<button class="cell ${ds===t0()?'today':''} ${S.selDay===ds?'sel':''}" data-cell="${ds}"><span class="dn">${d}</span><span class="dots">${dots}</span></button>`;
}
const ooDay=S.selDay?S.oneoffs.filter(o=>o.d===S.selDay):[];
const det=S.selDay?`<div class="card"><h3>${S.selDay}</h3>${dayItems(S.selDay,false).map(x=>`<div class="item"><div class="b"><div class="nm">${esc(x.name)}</div><div class="meta">${x.time}${x.route&&x.route!=='oral'?' · '+un(x,x.dose).toFixed(1)+' units':''}${x.site?' · '+x.site:''}</div></div></div>`).join('')}
${ooDay.map(o=>`<div class="item"><div class="b"><div class="nm">${esc(o.name)}<span class="badge">one-off</span></div>${o.note?`<div class="meta">${esc(o.note)}</div>`:''}</div></div>`).join('')}
${!dayItems(S.selDay,false).length&&!ooDay.length?'<div class="empty">Nothing.</div>':''}</div>`:'';
return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
<button class="btn sec sm" data-mon="-1">‹</button><b>${MONTHS[m]} ${y}</b><button class="btn sec sm" data-mon="1">›</button></div>
<div class="cal">${DAYS.map(d=>`<div class="cd">${d[0]}</div>`).join('')}${cells}</div>
<div class="legend" style="margin-top:12px"><span class="lg"><span class="lgc" style="background:var(--acc)"></span>injection</span><span class="lg"><span class="lgc" style="background:var(--ok)"></span>oral</span><span class="lg"><span class="lgc" style="background:var(--oil)"></span>oil</span><span class="lg"><span class="lgc" style="background:#a855f7"></span>one-off</span></div></div>${det}`;
}
function vStack(){
const row=c=>{const oral=!c.route||c.route==='oral';const u=un(c,c.dose);
return `<div class="item ${c.paused?'off':''}"><button class="pz ${c.paused?'on':''}" data-pause="${c.id}">${c.paused?'▶':'⏸'}</button>
<div class="b" data-edit="compounds:${c.id}"><div class="nm">${esc(c.name)}<span class="badge">${cN(c.cls)}</span>${oral?'':`<span class="badge">${rN(c.route)}</span>`}${c.paused?'<span class="badge">paused</span>':''}</div>
<div class="meta">${oral?esc(c.dose||''):`<span class="u">${u.toFixed(1)} units</span> (${mgLbl(c.dose)})`} · ${fN(c.freq)}${dayStr(c)} ${c.time}${c.site?' · '+c.site:''}</div>
${c.note?`<div class="meta">${esc(c.note)}</div>`:''}</div><button class="x" data-del="compounds:${c.id}">×</button></div>`;};
return `<div class="card"><h3>Active (${S.compounds.filter(live).length})</h3>${S.compounds.filter(live).map(row).join('')||'<div class="empty">None.</div>'}</div>
<div class="card"><h3>Paused (${S.compounds.filter(c=>c.paused).length})</h3>${S.compounds.filter(c=>c.paused).map(row).join('')||'<div class="empty">None paused.</div>'}
<div class="note">Tap a name to edit days, start date or dose.</div></div>
<div class="card"><h3>Medications</h3>${S.meds.map(x=>`<div class="item"><div class="b" data-edit="meds:${x.id}"><div class="nm">${esc(x.name)}<span class="badge">${cN(x.cls)}</span></div><div class="meta">${esc(x.dose)} · ${fN(x.freq)} ${x.time}</div></div><button class="x" data-del="meds:${x.id}">×</button></div>`).join('')}</div>`;
}
function vSupps(){
const row=s=>`<div class="item ${s.on?'':'off'}"><button class="chk ${s.on?'on':''}" data-tog="${s.id}">✓</button>
<div class="b" data-edit="supps:${s.id}"><div class="nm">${esc(s.name)}</div><div class="meta">${esc(s.dose||'')}${s.on?' · '+s.time:''}</div></div>
<button class="x" data-del="supps:${s.id}">×</button></div>`;
return `<div class="card"><h3>On (${S.supps.filter(s=>s.on).length})</h3>${S.supps.filter(s=>s.on).map(row).join('')||'<div class="empty">None.</div>'}</div>
<div class="card"><h3>Off (${S.supps.filter(s=>!s.on).length})</h3>${S.supps.filter(s=>!s.on).map(row).join('')||'<div class="empty">None.</div>'}</div>
<div class="card"><h3>Add</h3><div class="row g3"><div><label>Name</label><input id="pN"></div><div><label>Dose</label><input id="pD"></div><div><label>Time</label><input id="pT" type="time" value="12:00"></div></div><button class="btn" id="pAdd">Add</button></div>`;
}
document.addEventListener('click',e=>{if(e.target.id!=='pAdd')return;const g=id=>document.getElementById(id);
if(!g('pN').value){alert('Name required');return;}
S.supps.push({id:uid(),name:g('pN').value,cls:'supp',dose:g('pD').value,freq:'daily',time:g('pT').value,note:'',start:t0(),on:true});save();render();});
function vInv(){return `<div class="card"><h3>Inventory</h3><table><tr><th>Item</th><th>Qty</th><th>Note</th><th></th></tr>${S.storage.map(s=>`<tr><td data-edit="storage:${s.id}">${esc(s.name)}<div class="meta">${cN(s.cls)}</div></td><td>${esc(s.qty)}</td><td class="meta">${esc(s.note||'')}</td><td><button class="x" data-del="storage:${s.id}">×</button></td></tr>`).join('')}</table></div>`;}
const RULES=[['ssri','pde5','info','Fluoxetine inhibits CYP2D6 - PDE5 runs hotter.'],['bp','pde5','warn','Propranolol + PDE5 = additive hypotension.'],['bp','pde5','info','Propranolol before sex can impair erection.'],['aas','pde5','info','Primo and mast lower E2. Crashed E2 wrecks erections.'],['aas','pde5','info','Tren and NPP raise prolactin - direct cause of ED.'],['aas','pde5','info','High hematocrit degrades erection quality. Donate above 52%.'],['glp1','glp1','info','Never run tirzepatide and retatrutide together.'],['glp1','abx','warn','GLP-1 shifts doxy absorption. 2h from minerals.'],['abx','supp','warn','Minerals and dairy bind doxycycline.'],['aas','supp','info','Creatine raises serum creatinine.'],['ghs','glp1','ok','Tesamorelin raises IGF-1; the GLP-1 partly offsets it.'],['nad','stim','info','NAD+ flushes and bumps pulse. Pin early.'],['skin','supp','ok','GHK-Cu is copper - zinc at night balances the load.'],['supp','glp1','ok','Electrolytes and psyllium are not optional on a GLP-1.'],['heal','heal','ok','BPC, TB-500, KPV and GHK-Cu share a syringe.'],['aas','aas','info','Multiple oils: watch estradiol and prolactin.']];
function flags(){const items=[...S.compounds.filter(live),...S.meds,...S.supps.filter(s=>s.on)];const h=[];
for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];
RULES.forEach(([x,y,l,t])=>{if((a.cls===x&&b.cls===y)||(a.cls===y&&b.cls===x))h.push([l,t,`${a.name} + ${b.name}`]);});}
const se={};return h.filter(x=>{const k=x[1]+x[2];if(se[k])return false;se[k]=1;return true;});}
function vFlags(){const f=flags();return `<div class="card"><h3>Flags (${f.length})</h3>${f.map(([l,t,w])=>`<div class="item"><div class="b"><div class="nm ${l==='warn'?'warn':''}">${esc(t)}</div><div class="meta">${esc(w)}</div></div></div>`).join('')}</div>`;}
function vPlan(){return `<div class="card"><h3>Reality check</h3><div class="meta">The GLP-1 moves the scale. Protein and lifting decide whether you lose fat or muscle.</div></div>
<div class="card"><h3>GLP-1 switch</h3><div class="meta"><b>Bridge:</b> tirz 5mg if you have doses left.</div><div class="meta"><b>Reta:</b> 2mg x2wk, then 4mg. 6mg if stalled.</div><div class="meta"><b>Never both.</b></div></div>
<div class="card"><h3>Oil protocol</h3><div class="meta"><b>Now to 11/2:</b> Mon/Thu: test cyp 75mg + primo 100mg.</div><div class="meta"><b>From 11/2:</b> EOD: test 40 + primo 50 + mast 50.</div></div>
<div class="card"><h3>Targets</h3><div class="meta">Protein 150-170g. 1700-1900 kcal. 1-2 lb/wk. Waist under 30 in. 3x full body.</div></div>`;}
const PROTO=[['GHK-Cu 50 mg','3mL = 16.67mg/mL','1mg x15d then 2mg x15d','30 on / 30 off'],['ARA-290 12 mg','2.4mL = 5mg/mL','2mg x1wk then 4mg x28d','Cycle it'],['5-amino-1MQ 100 mg','4mL = 25mg/mL','2.5-5mg SubQ','Caps are pin-free'],['Glutathione 1200 mg','6mL = 200mg/mL','200mg 2-3x/wk IM','Stings SubQ'],['NAD+','assume 1200mg + 12mL','25mg 2x/wk, titrate','Verify label'],['KPV 30 mg','3mL = 10mg/mL','500mcg daily 5/2','Shares barrel with BPC'],['Retatrutide 60 mg','3mL = 20mg/mL','2mg x2wk then 4mg','Taper tirz out'],['Tesamorelin 10 mg','2mL = 5mg/mL','1mg = 20u nightly','Fasted'],['Thymosin a-1 10 mg','2mL = 5mg/mL','1.6mg = 32u 2x/wk','5mg vial needs 1mL'],['Cagrilintide 5 mg','2mL = 2.5mg/mL','0.25mg weekly','Test before Elora'],['Selank 5 mg','2mL = 2.5mg/mL','250mcg daily','2-4 week run'],['VIP 5.8 mg','2mL = 2.9mg/mL','50-100mcg daily','Watch BP']];
function vProto(){return `<div class="card"><h3>Protocols</h3><table><tr><th>Item</th><th>Recon</th><th>Dose</th><th>Note</th></tr>${PROTO.map(p=>`<tr><td><b>${p[0]}</b></td><td class="meta">${p[1]}</td><td>${p[2]}</td><td class="meta">${p[3]}</td></tr>`).join('')}</table></div>`;}
function icsDate(d,t){const a=d.split('-'),b=t.split(':');return `${a[0]}${a[1]}${a[2]}T${b[0]}${b[1]}00`;}
function buildICS(){
const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Stack//EN','CALSCALE:GREGORIAN'];
const today=t0();
S.compounds.filter(c=>live(c)&&c.freq!=='prn').forEach(c=>{
let rr='';
if(c.freq==='daily'||c.freq==='bid')rr='RRULE:FREQ=DAILY';
else if(c.freq==='eod')rr='RRULE:FREQ=DAILY;INTERVAL=2';
else if(c.freq==='weekly')rr='RRULE:FREQ=WEEKLY';
else if(c.days&&c.days.length)rr='RRULE:FREQ=WEEKLY;BYDAY='+c.days.map(d=>['SU','MO','TU','WE','TH','FR','SA'][d]).join(',');
const add=(t,suf)=>{L.push('BEGIN:VEVENT','UID:'+c.id+suf+'@stack','DTSTAMP:'+icsDate(today,'00:00'));
 L.push('DTSTART:'+icsDate(today,t));if(rr)L.push(rr);
 L.push('SUMMARY:'+c.name+' '+un(c,c.dose).toFixed(1)+' units');
 L.push('DESCRIPTION:'+rN(c.route)+(c.site?' - '+c.site:''));
 L.push('BEGIN:VALARM','TRIGGER:0','ACTION:DISPLAY','DESCRIPTION:'+c.name,'END:VALARM','END:VEVENT');};
add(c.time,'');if(c.freq==='bid'&&c.time2)add(c.time2,'b');});
L.push('END:VCALENDAR');return L.join('\r\n');}
const GH=()=>({'Authorization':'token '+SY.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'});
async function pushGist(silent){
if(!SY.token){if(!silent)alert('Add a token first');return;}
try{
const content=JSON.stringify(S,null,2);
let r;
if(!SY.gist){
r=await fetch('https://api.github.com/gists',{method:'POST',headers:GH(),body:JSON.stringify({description:'Stack backup',public:false,files:{'stack.json':{content:content}}})});
if(!r.ok)throw new Error('HTTP '+r.status);
const j=await r.json();SY.gist=j.id;
}else{
r=await fetch('https://api.github.com/gists/'+SY.gist,{method:'PATCH',headers:GH(),body:JSON.stringify({files:{'stack.json':{content:content}}})});
if(!r.ok)throw new Error('HTTP '+r.status);
}
SY.last=new Date().toISOString();saveSY();
if(!silent){render();alert('Pushed.');}
}catch(e){if(!silent)alert('Push failed: '+e.message);}
}
async function pullGist(){
if(!SY.token||!SY.gist){alert('Need a token and a gist');return;}
if(!confirm('Replace everything on this device with the gist copy?'))return;
try{
const r=await fetch('https://api.github.com/gists/'+SY.gist,{headers:GH()});
if(!r.ok)throw new Error('HTTP '+r.status);
const j=await r.json();
const c=j.files['stack.json'].content;
S=JSON.parse(c);save();render();alert('Pulled.');
}catch(e){alert('Pull failed: '+e.message);}
}
async function forceUpdate(){
if(!confirm('Clear the cache and reload?'))return;
try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();
for(const r of rs)await r.unregister();}
if(window.caches){const ks=await caches.keys();for(const k of ks)await caches.delete(k);}}catch(e){}
location.reload();
}
function vTools(){
const mask=SY.token?SY.token.slice(0,7)+'…'+SY.token.slice(-4):'';
return `<div class="card"><h3>Build</h3><div class="meta">Build <b>${BUILD}</b> · if this is lower than deployed, you are on a cached copy.</div>
<div class="fl"><button class="btn sec sm" id="fu">Force refresh</button></div></div>
<div class="card"><h3>Sync</h3>
<div class="row"><div><label>Token ${mask?'· saved '+mask:''}</label><input id="syT" type="password" placeholder="ghp_..." value="${esc(SY.token)}"></div></div>
<div class="row"><div><label>Gist ID</label><input id="syG" placeholder="blank = create a new one on first push" value="${esc(SY.gist)}"></div></div>
<div class="row g2"><div><label>Auto-push</label><select id="syA"><option value="0" ${SY.auto?'':'selected'}>Off</option><option value="1" ${SY.auto?'selected':''}>On</option></select></div><div><label>Last push</label><input value="${SY.last?new Date(SY.last).toLocaleString():'never'}" readonly></div></div>
<div class="fl"><button class="btn sm" id="sySave">Save</button><button class="btn sec sm" id="syPush">Push</button><button class="btn sec sm" id="syPull">Pull</button><button class="btn sec sm" id="syForget">Forget</button></div>
<div class="note">Last write wins. Pull before pushing from another device.</div></div>
<div class="card"><h3>Calculator</h3><div class="row g3"><div><label>Vial</label><input id="cM" type="number" value="1200"></div><div><label>BAC mL</label><input id="cB" type="number" value="12" step="0.1"></div><div><label>Dose</label><input id="cD" type="number" value="25" step="0.01"></div></div><button class="btn" id="cGo">Calculate</button><div id="cO"></div></div>
<div class="card"><h3>Calendar export</h3><div class="fl"><button class="btn sm" id="ics">Export .ics</button></div></div>
<div class="card"><h3>Pen fill sheet</h3><table><tr><th>Pen</th><th>Recon</th><th>Dial</th><th>Lasts</th></tr>
<tr><td><b>1 — BPC+GHK</b></td><td>BPC 10mg + GHK 25mg in 3mL</td><td><b>12u</b> 2x/day</td><td>~11d</td></tr>
<tr><td><b>2 — Tesa</b></td><td>10mg + 2mL = 5mg/mL</td><td><b>20u</b> nightly</td><td>~9d</td></tr>
<tr><td><b>3 — KPV</b></td><td>30mg + 3mL = 10mg/mL</td><td><b>5u</b> daily</td><td>~59d</td></tr></table></div>
<div class="card"><h3>Backup</h3><div class="fl"><button class="btn sec sm" id="exp">Export JSON</button><label class="btn sec sm" style="margin:0">Restore<input type="file" id="imp" accept=".json" style="display:none"></label></div></div>`;
}
document.addEventListener('click',e=>{
if(e.target.id==='fu'){forceUpdate();return;}
if(e.target.id==='sySave'){SY.token=document.getElementById('syT').value.trim();SY.gist=document.getElementById('syG').value.trim();SY.auto=document.getElementById('syA').value==='1';saveSY();render();return;}
if(e.target.id==='syPush'){SY.token=document.getElementById('syT').value.trim();SY.gist=document.getElementById('syG').value.trim();SY.auto=document.getElementById('syA').value==='1';saveSY();pushGist();return;}
if(e.target.id==='syPull'){SY.token=document.getElementById('syT').value.trim();SY.gist=document.getElementById('syG').value.trim();saveSY();pullGist();return;}
if(e.target.id==='syForget'){SY.token='';SY.gist='';SY.auto=false;saveSY();render();return;}
if(e.target.id==='ics'){const b=new Blob([buildICS()],{type:'text/calendar'});const a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download='stack.ics';a.click();return;}
if(e.target.id==='cGo'){const g=id=>document.getElementById(id);
const m=+g('cM').value,b=+g('cB').value,d=+g('cD').value;if(!m||!b||!d){g('cO').innerHTML='<div class="note warn">Fill all fields</div>';return;}
const c=m/b,v=d/c;g('cO').innerHTML=`<div class="note"><b>${c.toFixed(2)} per mL</b><br>Draw <b>${(v*100).toFixed(1)} units</b> for ${d}</div>`;return;}
if(e.target.id==='exp'){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download='stack-backup-'+t0()+'.json';a.click();return;}
});
document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;
const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('Restored');}catch(x){alert('Bad file');}};r.readAsText(f);});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
</script>
