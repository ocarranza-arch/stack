<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stack</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0d10;--card:#14181d;--card2:#1a2027;--line:#242a32;--tx:#e8ecf1;--dim:#8b95a3;--acc:#4da3ff;--ok:#35c07a;--warn:#e8a33d;--bad:#e0605a}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--card2:#eef1f4;--line:#e0e4ea;--tx:#12161b;--dim:#65707d;--acc:#0a66c2;--ok:#128a53;--warn:#a9691a;--bad:#b8382f}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
h1{font-size:17px;margin:0;font-weight:700}
.sub{font-size:12px;color:var(--dim);margin-top:2px}
main{padding:12px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 8px;font-weight:650;color:var(--tx)}
.row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chk{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:transparent;cursor:pointer;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#04140c}
.chk.sk{background:var(--card2);border-color:var(--warn);color:var(--warn);border-style:dashed}
.nm{flex:1;min-width:0}
.l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.l1 b{font-size:15px;font-weight:600}
.l2{font-size:12px;color:var(--dim);margin-top:3px}
.dose{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;padding:0;text-align:left;border-bottom:1px dashed var(--dim);cursor:pointer}
.dose.warn{color:var(--warn);border-color:var(--warn)}
.done .l1 b{color:var(--dim);font-weight:500}
.struck .l1 b{color:var(--warn);text-decoration:line-through}
.timechip{font-size:11px;color:var(--acc);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timechip.any{color:var(--dim)}
.timechip.prn{color:var(--warn)}
.skip{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto}
.skip.on{background:var(--card2);color:var(--warn);border-color:var(--warn)}
button{font-family:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:650;cursor:pointer;width:100%}
.btn.alt{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:8px 11px;font-size:13px;width:auto}
.btn.bad{background:var(--bad)}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:10px;font:inherit;font-size:15px}
label{font-size:12px;color:var(--dim);display:block;margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-block;font-size:11px;padding:3px 7px;border-radius:99px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav a{padding:11px 0 12px;text-align:center;font-size:11px;color:var(--dim);text-decoration:none;font-weight:600}
nav a.on{color:var(--acc)}
nav a i{display:block;font-size:17px;font-style:normal;margin-bottom:2px}
.mono{font-variant-numeric:tabular-nums}
.dim{color:var(--dim);font-size:13px}
.tiny{font-size:11px;color:var(--dim)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:10px;color:var(--dim);padding-bottom:2px}
.cal .d{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;position:relative;background:var(--card)}
.cal .d.out{opacity:.35}
.cal .d.tod{border-color:var(--acc)}
.cal .d .dot{width:5px;height:5px;border-radius:50%;background:var(--acc);margin-top:2px}
.cal .d .dot.p{background:#a06bff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:60;overflow:auto}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:420px;width:100%}
.sheet h3{margin:0 0 6px;font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<nav>
<a href="#today"><i>◎</i>Today</a>
<a href="#body"><i>◔</i>Body</a>
<a href="#labs"><i>⌁</i>Labs</a>
<a href="#sites"><i>◈</i>Sites</a>
<a href="#more"><i>≡</i>More</a>
</nav>
<script>
"use strict";
var BUILD="v15";
var KEYS=["stack_v1","venice_stack_v1","stack_v2","venice_stack_v2"];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function findKey(){for(var i=0;i<KEYS.length;i++){try{if(localStorage.getItem(KEYS[i]))return KEYS[i]}catch(e){}}return "stack_v1"}
var KEY=findKey(),SKEY="stack_sync";
function iso(d){var x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function pd(s){var p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){return iso(new Date())}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function n2(x){return Math.round(x*10)/10}
function num(x){var v=parseFloat(String(x==null?"":x).replace(/[^0-9.]/g,""));return isNaN(v)?0:v}
function hhmm(t){var d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}

function blank(){return {compounds:[],meds:[],storage:[],done:{},skips:{},medLog:{},oneoff:[],body:[],labs:[],sites:[],settings:{unitsPerMl:100},protocols:[]}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&typeof o==="object")return o}}catch(e){}return blank()}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var DEFAULT_SITES=["Abdomen L","Abdomen R","Thigh L","Thigh R","Delt L","Delt R","Ventrogluteal L","Ventrogluteal R","Glute L","Glute R"];
var LABS=["Hematocrit","Hemoglobin","Estradiol","Total T","Free T","SHBG","Prolactin","PSA","IGF-1","A1c","Fasting glucose","Insulin","TSH","Free T4","LDL","HDL","Triglycerides","ALT","AST","Creatinine","eGFR","hs-CRP","Ferritin"];
var OILRE=/(test|cyp|enanth|prop|undec|sustanon|s250|primo|mast|tren|deca|bold|equipoise|eq\b)/i;

function norm(){
  var b=blank();
  Object.keys(b).forEach(function(k){if(S[k]==null)S[k]=b[k]});
  S.compounds.forEach(function(c){
    if(!c.name)c.name=c.n||c.title||"Compound";
    c.n=c.name;
    if(!c.id)c.id=uid();
    if(c.freq==null)c.freq=c.freqType||"daily";
    c.freqType=c.freq;
    if(c.doseMg==null)c.doseMg=num(c.dose)||num(c.mg);
    c.doseMg=num(c.doseMg);
    c.dose=c.doseMg;
    if(!Array.isArray(c.days)||!c.days.length)c.days=c.freq==="2xw"?[1,4]:[];
    if(!c.start)c.start=today();
    if(!c.route)c.route="subq";
    if(c.time==null)c.time=c.t||"";
    c.vialMg=num(c.vialMg||c.vial||c.vialmg||c.mgPerVial);
    c.bacMl=num(c.bacMl||c.bac||c.water||c.bacWater);
    c.mgPerMl=num(c.mgPerMl||c.conc||c.mgml);
    c.vialMl=num(c.vialMl||c.ml);
    if(!c.mode){
      if(c.mgPerMl||OILRE.test(c.name))c.mode="liquid";
      else c.mode="powder";
    }
    if(c.mode==="liquid"){
      if(!c.vialMl)c.vialMl=c.bacMl||0;
      if(!c.mgPerMl){
        var k=(c.vialMg&&c.bacMl)?c.vialMg/c.bacMl:0;
        if(k>=60)c.mgPerMl=Math.round(k);else c.needConc=true;
      }
      if(c.remainingMl==null)c.remainingMl=c.vialMl||1;
    }else{
      if(c.remainingMl==null)c.remainingMl=c.bacMl||1;
    }
    c.remainingMl=num(c.remainingMl);
  });
  S.meds.forEach(function(m){
    if(!m.name)m.name=m.n||m.med||m.medication||m.label||"Medication";
    m.n=m.name;
    if(m.dose==null)m.dose=m.d||m.dosage||m.strength||"";
    if(!m.times)m.times=[];
    if(!Array.isArray(m.times))m.times=String(m.times).split(",");
    if(m.time&&m.times.indexOf(m.time)<0)m.times.push(m.time);
    m.times=m.times.map(function(x){return String(x).trim()}).filter(Boolean);
    delete m.time;
  });
  S.storage.forEach(function(s){
    if(!s.n)s.n=s.name||s.item||"Item";
    if(s.qty!=null)s.qty=num(s.qty);
  });
  if(!S.sites.length)S.sites=DEFAULT_SITES.map(function(n){return {n:n,last:null}});
  if(!S.labs.length)S.labs=LABS.map(function(n){return {n:n,v:[],unit:""}});
  S.sites=S.sites.filter(function(s,i,a){return a.findIndex(function(x){return x.n===s.n})===i});
  healDates();
}

function healDates(){
  Object.keys(S.done).forEach(function(k){
    var bucket=S.done[k];
    Object.keys(bucket).forEach(function(id){
      var e=bucket[id];
      if(!e||typeof e!=="object"){delete bucket[id];return}
      if(!e.d)e.d=e.t?iso(new Date(e.t)):k;
      if(e.d!==k){
        S.done[e.d]=S.done[e.d]||{};
        if(!S.done[e.d][id])S.done[e.d][id]=e;
        delete bucket[id];
      }
    });
    if(!Object.keys(bucket).length&&S.done[k])delete S.done[k];
  });
}
norm();

function conc(c){return c.mode==="liquid"?num(c.mgPerMl):(c.vialMg&&c.bacMl?c.vialMg/c.bacMl:0)}
function unitsFor(c,mg){var k=conc(c);return k>0?mg/k*100:0}
function mlFor(c,mg){var k=conc(c);return k>0?mg/k:0}
function dosesLeft(c){var k=conc(c);if(!k||!c.doseMg)return null;return Math.floor((c.remainingMl||0)/mlFor(c,c.doseMg))}
function concLabel(c){
  if(c.mode==="liquid")return c.mgPerMl?n2(c.mgPerMl)+" mg/mL":"set mg/mL";
  var k=conc(c);return k>0?n2(k)+" mg/mL from "+n2(c.vialMg)+" mg/"+n2(c.bacMl)+" mL":"set vial and water";
}

function occurs(c,ds){
  if(c.paused||c.freq==="prn"||c.freq==="off")return false;
  if(!c.start)return false;
  var a=pd(c.start),b=pd(ds);
  if(b<a)return false;
  var diff=Math.round((b-a)/864e5);
  if(c.freq==="daily")return true;
  if(c.freq==="eod")return diff%2===0;
  if(c.freq==="2xw")return (c.days||[]).indexOf(b.getDay())>-1;
  if(c.freq==="weekly")return b.getDay()===a.getDay();
  if(c.freq==="once")return diff===0;
  return false;
}
function isDone(ds,id){var e=S.done[ds]&&S.done[ds][id];if(!e)return false;return e.d?e.d===ds:true}
function isSkip(ds,id){return (S.skips[ds]||[]).indexOf(id)>-1}

function logDose(id,ds,mg){
  var c=S.compounds.find(function(x){return x.id===id});if(!c)return false;
  var dmg=(mg!=null&&num(mg)>0)?num(mg):c.doseMg;
  if(!dmg||dmg<=0)return false;
  if(isDone(ds,id)){
    var old=S.done[ds][id];
    c.remainingMl=Math.max(0,(c.remainingMl||0)+mlFor(c,old.mg||c.doseMg)-mlFor(c,dmg));
    S.done[ds][id]={t:old.t,d:ds,mg:dmg,units:n2(unitsFor(c,dmg))};
    save();return true;
  }
  S.done[ds][id]={t:Date.now(),d:ds,units:n2(unitsFor(c,dmg)),mg:dmg};
  c.remainingMl=Math.max(0,(c.remainingMl||0)-mlFor(c,dmg));
  S.skips[ds]=(S.skips[ds]||[]).filter(function(x){return x!==id});
  save();return true;
}
function undoDose(id,ds){
  var c=S.compounds.find(function(x){return x.id===id});
  if(S.done[ds]&&S.done[ds][id]){
    var r=S.done[ds][id];
    if(c)c.remainingMl=(c.remainingMl||0)+mlFor(c,r.mg||c.doseMg);
    delete S.done[ds][id];save();
  }
}
function moveDose(id,from,to){
  if(!from||!to||from===to)return;
  var e=S.done[from]&&S.done[from][id];if(!e)return;
  S.done[to]=S.done[to]||{};
  if(!S.done[to][id])S.done[to][id]={t:e.t,d:to,mg:e.mg,units:e.units};
  delete S.done[from][id];
  S.skips[from]=(S.skips[from]||[]).filter(function(x){return x!==id});
  save();
}
function toggleSkip(id,ds){
  var a=S.skips[ds]=S.skips[ds]||[];
  var i=a.indexOf(id);
  if(i>-1)a.splice(i,1);else a.push(id);
  save();
}

var tab=(location.hash||"#today").slice(1);
window.addEventListener("hashchange",function(){tab=(location.hash||"#today").slice(1);render()});

function head(title,sub){return '<header><h1>'+esc(title)+'</h1><div class="sub">'+esc(sub)+'</div></header>'}
function doseLine(c,mg){
  var u=unitsFor(c,mg);
  if(!u)return n2(mg)+' mg · no concentration';
  return n2(mg)+' mg · '+n2(u)+' u · '+n2(mlFor(c,mg))+' mL';
}
function timeChip(t,prn){
  if(prn)return '<span class="timechip prn">PRN</span>';
  if(!t)return '<span class="timechip any">any time</span>';
  return '<span class="timechip">'+esc(t)+'</span>';
}
function doseBtn(c,ds,mg){
  if(!conc(c))return '<button class="dose warn" data-edit="'+c.id+'">'+n2(mg)+' mg · tap to set concentration</button>';
  return '<button class="dose" data-dose="'+c.id+'|'+ds+'">'+doseLine(c,mg)+'</button>';
}

function viewToday(){
  var d=today();
  var due=S.compounds.filter(function(c){return occurs(c,d)&&!isDone(d,c.id)&&!isSkip(d,c.id)});
  var done=S.compounds.filter(function(c){return isDone(d,c.id)&&c.freq!=="prn"});
  var skipped=S.compounds.filter(function(c){return isSkip(d,c.id)&&!isDone(d,c.id)});
  var total=due.length+done.length+skipped.length;
  var off=S.compounds.filter(function(c){return !occurs(c,d)&&!isDone(d,c.id)&&!c.paused&&c.freq!=="prn"&&c.freq!=="off"});
  function byTime(a,b){return (a.time||"99:99").localeCompare(b.time||"99:99")}
  due.sort(byTime);done.sort(byTime);skipped.sort(byTime);

  var h=head("Today",new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}));
  h+='<main>';
  h+='<div class="card"><div class="row" style="border:0;padding:0"><div class="nm"><div class="l1"><b class="mono">'+done.length+' of '+total+'</b></div><div class="l2">doses logged today</div></div><span class="pill '+(done.length===total&&total>0?"ok":"")+'">'+(total?Math.round(done.length/total*100):0)+'%</span></div></div>';

  if(!total)h+='<div class="card"><div class="dim">Nothing scheduled. Add one below or use a one-off.</div></div>';

  if(due.length||skipped.length||done.length){
    h+='<div class="card"><h2>Doses</h2>';
    due.forEach(function(c){
      h+='<div class="row"><div class="chk" data-log="'+c.id+'">✓</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b>'+timeChip(c.time,false)+'</div><div class="l2">'+doseBtn(c,d,c.doseMg)+'</div></div><button class="skip" data-skip="'+c.id+'">Skip</button></div>';
    });
    skipped.forEach(function(c){
      h+='<div class="row struck"><div class="chk sk" data-log="'+c.id+'">–</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b>'+timeChip(c.time,false)+'</div><div class="l2">'+doseBtn(c,d,c.doseMg)+'</div></div><button class="skip on" data-skip="'+c.id+'">Unskip</button></div>';
    });
    done.forEach(function(c){
      var r=S.done[d][c.id]||{};
      h+='<div class="row done"><div class="chk on" data-undo="'+c.id+'">✓</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b>'+timeChip(c.time,false)+'</div><div class="l2">'+doseBtn(c,r.mg||c.doseMg,d)+' · logged '+hhmm(r.t||Date.now())+'</div></div><button class="skip" data-skip="'+c.id+'">Skip</button></div>';
    });
    h+='</div>';
  }

  h+=viewMedsToday();

  h+='<div class="card"><h2>Backdate a dose</h2><div class="dim" style="margin-bottom:8px">For something you already took on another day.</div>';
  h+='<label>Compound</label><select id="bdSel">'+S.compounds.filter(function(c){return c.freq!=="prn"}).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")+'</select>';
  h+='<div class="grid2"><div><label>Date</label><input type="date" id="bdDate" value="'+addDays(d,-1)+'" max="'+d+'"></div><div><label>Dose (mg)</label><input id="bdDose" type="number" step="0.01" inputmode="decimal"></div></div>';
  h+='<div class="tiny" id="bdOut" style="margin-top:6px"></div>';
  h+='<div style="margin-top:10px"><button class="btn" id="bdGo">Log it</button></div></div>';

  h+='<div class="card"><h2>One-off injection</h2><div class="dim" style="margin-bottom:8px">Not on the schedule at all. Shows once, never recurs.</div>';
  h+='<label>Name</label><input id="ooName" placeholder="e.g. TB-500 2 mg">';
  h+='<div class="grid2"><div><label>Date</label><input type="date" id="ooDate" value="'+d+'"></div><div><label>Dose (mg)</label><input id="ooMg" type="number" step="0.01" inputmode="decimal"></div></div>';
  h+='<div style="margin-top:10px"><button class="btn alt" id="ooGo">Add one-off</button></div></div>';

  if(off.length){
    h+='<div class="card"><h2>Not scheduled today</h2>';
    off.forEach(function(c){
      h+='<div class="row"><div class="chk" data-log="'+c.id+'">✓</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b></div><div class="l2">'+esc(c.freq)+' · '+doseBtn(c,d,c.doseMg)+'</div></div></div>';
    });
    h+='</div>';
  }

  h+=viewAsNeeded();
  h+='</main>';
  return h;
}

function viewAsNeeded(){
  var d=today();
  var prnC=S.compounds.filter(function(c){return c.freq==="prn"&&!c.paused});
  var prnM=medSlots().filter(function(s){return !s.t});
  if(!prnC.length&&!prnM.length)return "";
  var h='<div class="card"><h2>As needed</h2><div class="tiny" style="margin-bottom:6px">Not counted in the daily total</div>';
  prnC.forEach(function(c){
    var dn=isDone(d,c.id),r=dn?S.done[d][c.id]:null;
    h+='<div class="row'+(dn?" done":"")+'"><div class="chk'+(dn?" on":"")+'" data-log="'+c.id+'">✓</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b><span class="timechip prn">PRN</span></div><div class="l2">'+doseBtn(c,d,dn&&r.mg?r.mg:c.doseMg)+(dn?' · logged '+hhmm(r.t||Date.now()):'')+'</div></div></div>';
  });
  prnM.forEach(function(s){
    var k=medKey(s.m,s.t),dn=isMedDone(d,k);

function medSlots(){

function viewCal(){
  var base=S.calMonth?pd(S.calMonth+"-01"):pd(today());
  base.setDate(1);
  var y=base.getFullYear(),m=base.getMonth();
  var first=new Date(y,m,1),start=new Date(first);start.setDate(1-first.getDay());
  var h='<div class="card"><h2>'+base.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</h2>';
  h+='<div class="cal">'+DOW.map(function(x){return '<div class="hd">'+x[0]+'</div>'}).join("");
  for(var i=0;i<42;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);
    var ds=iso(d),out=d.getMonth()!==m,tod=ds===today();
    var n=S.compounds.filter(function(c){return occurs(c,ds)}).length;
    var one=S.oneoff.filter(function(o){return o.date===ds}).length;
    h+='<div class="d'+(out?" out":"")+(tod?" tod":"")+'" data-day="'+ds+'">'+d.getDate()+(n||one?'<div class="dot'+(one?" p":"")+'"></div>':'')+'</div>';
  }
  h+='</div><div class="grid2" style="margin-top:10px"><button class="btn alt sm" id="calPrev">Prev</button><button class="btn alt sm" id="calNext">Next</button></div></div>';
  if(S.calDay){
    var ds2=S.calDay;
    h+='<div class="card"><h2>'+esc(pd(ds2).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}))+'</h2>';
    var items=S.compounds.filter(function(c){return occurs(c,ds2)});
    if(!items.length)h+='<div class="dim">Nothing scheduled.</div>';
    items.forEach(function(c){
      var dn=isDone(ds2,c.id),r=dn?(S.done[ds2][c.id]||{}):null;
      h+='<div class="row'+(dn?" done":"")+'"><div class="chk'+(dn?" on":"")+'" data-logday="'+c.id+'|'+ds2+'">✓</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b>'+timeChip(c.time,false)+'</div><div class="l2">'+doseBtn(c,ds2,dn&&r.mg?r.mg:c.doseMg)+'</div></div></div>';
    });
    S.oneoff.filter(function(o){return o.date===ds2}).forEach(function(o){
      h+='<div class="row"><div class="nm"><div class="l1"><b>'+esc(o.name)+'</b><span class="pill">one-off'+(o.mg?" · "+n2(o.mg)+" mg":"")+'</span></div></div><button class="skip" data-deloo="'+o.id+'">×</button></div>';
    });
    h+='</div>';
  }
  return h;
}
