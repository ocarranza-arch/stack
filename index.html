<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Stack</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0d10;--card:#14181d;--card2:#1a2027;--line:#242a32;--tx:#e8ecf1;--dim:#8b95a3;--acc:#4da3ff;--ok:#35c07a;--warn:#e8a33d;--bad:#e0605a}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--card:#fff;--card2:#eef1f4;--line:#e0e4ea;--tx:#12161b;--dim:#65707d;--acc:#0a66c2;--ok:#128a53;--warn:#a9691a;--bad:#b8382f}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
h1{font-size:17px;margin:0;font-weight:700}
.sub{font-size:12px;color:var(--dim);margin-top:2px}
main{padding:12px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 8px;font-weight:650;color:var(--tx)}
.row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chk{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:transparent;cursor:pointer;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#04140c}
.chk.sk{background:var(--card2);border-color:var(--warn);color:var(--warn);border-style:dashed}
.nm{flex:1;min-width:0}
.l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.l1 b{font-size:15px;font-weight:600}
.l2{font-size:12px;color:var(--dim);margin-top:3px}
.dose{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;padding:0;text-align:left;border-bottom:1px dashed var(--dim);cursor:pointer}
.dose.warn{color:var(--warn);border-color:var(--warn)}
.done .l1 b{color:var(--dim);font-weight:500}
.struck .l1 b{color:var(--warn);text-decoration:line-through}
.timechip{font-size:11px;color:var(--acc);border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.timechip.any{color:var(--dim)}
.timechip.prn{color:var(--warn)}
.skip{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;cursor:pointer;flex:0 0 auto}
.skip.on{background:var(--card2);color:var(--warn);border-color:var(--warn)}
button{font-family:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:650;cursor:pointer;width:100%}
.btn.alt{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:8px 11px;font-size:13px;width:auto}
.btn.bad{background:var(--bad)}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:10px;font:inherit;font-size:15px}
label{font-size:12px;color:var(--dim);display:block;margin:8px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-block;font-size:11px;padding:3px 7px;border-radius:99px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30}
nav a{padding:11px 0 12px;text-align:center;font-size:11px;color:var(--dim);text-decoration:none;font-weight:600}
nav a.on{color:var(--acc)}
nav a i{display:block;font-size:17px;font-style:normal;margin-bottom:2px}
.mono{font-variant-numeric:tabular-nums}
.dim{color:var(--dim);font-size:13px}
.tiny{font-size:11px;color:var(--dim)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:10px;color:var(--dim);padding-bottom:2px}
.cal .d{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;position:relative;background:var(--card)}
.cal .d.out{opacity:.35}
.cal .d.tod{border-color:var(--acc)}
.cal .d .dot{width:5px;height:5px;border-radius:50%;background:var(--acc);margin-top:2px}
.cal .d .dot.p{background:#a06bff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px;z-index:60;overflow:auto}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:420px;width:100%}
.sheet h3{margin:0 0 6px;font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<nav>
<a href="#today"><i>◎</i>Today</a>
<a href="#body"><i>◔</i>Body</a>
<a href="#labs"><i>⌁</i>Labs</a>
<a href="#sites"><i>◈</i>Sites</a>
<a href="#more"><i>≡</i>More</a>
</nav>
<script>
"use strict";
var BUILD="v14";
var KEYS=["stack_v1","venice_stack_v1","stack_v2","venice_stack_v2"];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function findKey(){for(var i=0;i<KEYS.length;i++){try{if(localStorage.getItem(KEYS[i]))return KEYS[i]}catch(e){}}return "stack_v1"}
var KEY=findKey(),SKEY="stack_sync";
function iso(d){var x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function pd(s){var p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){return iso(new Date())}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function n2(x){return Math.round(x*10)/10}
function hhmm(t){var d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}

function blank(){return {compounds:[],meds:[],storage:[],done:{},skips:{},medLog:{},oneoff:[],body:[],labs:[],sites:[],settings:{unitsPerMl:100},protocols:[]}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&typeof o==="object")return o}}catch(e){}return blank()}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

var DEFAULT_SITES=["Abdomen L","Abdomen R","Thigh L","Thigh R","Delt L","Delt R","Ventrogluteal L","Ventrogluteal R","Glute L","Glute R"];
var LABS=["Hematocrit","Hemoglobin","Estradiol","Total T","Free T","SHBG","Prolactin","PSA","IGF-1","A1c","Fasting glucose","Insulin","TSH","Free T4","LDL","HDL","Triglycerides","ALT","AST","Creatinine","eGFR","hs-CRP","Ferritin"];
var OILRE=/(test|cyp|enanth|prop|undec|sustanon|s250|primo|mast|tren|deca|bold|equipoise|eq\b)/i;

function norm(){
  var b=blank();
  Object.keys(b).forEach(function(k){if(S[k]==null)S[k]=b[k]});
  S.compounds.forEach(function(c){
    if(!c.name)c.name=c.n||c.title||"Compound";
    c.n=c.name;
    if(!c.id)c.id=uid();
    if(c.freq==null)c.freq=c.freqType||"daily";
    c.freqType=c.freq;
    if(c.doseMg==null)c.doseMg=c.dose!=null?c.dose:(c.mg!=null&&!c.vialMg?c.mg:0);
    c.dose=c.doseMg;
    if(!Array.isArray(c.days)||!c.days.length)c.days=c.freq==="2xw"?[1,4]:[];
    if(!c.start)c.start=today();
    if(!c.route)c.route="subq";
    if(c.time==null)c.time=c.t||"";
    if(!c.vialMg)c.vialMg=+c.vial||+c.vialmg||+c.mgPerVial||0;
    if(!c.bacMl)c.bacMl=+c.bac||+c.water||+c.bacWater||0;
    if(c.mgPerMl==null)c.mgPerMl=+c.conc||+c.mgml||0;
    if(c.vialMl==null)c.vialMl=+c.ml||0;
    if(!c.mode){
      if(c.mgPerMl||OILRE.test(c.name))c.mode="liquid";
      else c.mode="powder";
    }
    if(c.mode==="liquid"){
      if(!c.vialMl)c.vialMl=c.bacMl||0;
      if(!c.mgPerMl){
        var k=(c.vialMg&&c.bacMl)?c.vialMg/c.bacMl:0;
        if(k>=60)c.mgPerMl=Math.round(k);else c.needConc=true;
      }
      if(c.remainingMl==null)c.remainingMl=c.vialMl||1;
    }else{
      if(c.remainingMl==null)c.remainingMl=c.bacMl||1;
    }
  });
  S.meds.forEach(function(m){
    if(!m.name)m.name=m.n||m.med||m.medication||m.label||"Medication";
    m.n=m.name;
    if(m.dose==null)m.dose=m.d||m.dosage||m.strength||"";
    if(!m.times)m.times=[];
    if(!Array.isArray(m.times))m.times=String(m.times).split(",");
    if(m.time&&m.times.indexOf(m.time)<0)m.times.push(m.time);
    m.times=m.times.map(function(x){return String(x).trim()}).filter(Boolean);
    delete m.time;
  });
  S.storage.forEach(function(s){
    if(!s.n)s.n=s.name||s.item||"Item";
    if(s.qty==null)s.qty=s.q||null;
  });
  if(!S.sites.length)S.sites=DEFAULT_SITES.map(function(n){return {n:n,last:null}});
  if(!S.labs.length)S.labs=LABS.map(function(n){return {n:n,v:[],unit:""}});
  S.sites=S.sites.filter(function(s,i,a){return a.findIndex(function(x){return x.n===s.n})===i});
  healDates();
}

function healDates(){
  Object.keys(S.done).forEach(function(k){
    var bucket=S.done[k];
    Object.keys(bucket).forEach(function(id){
      var e=bucket[id];
      if(!e||typeof e!=="object"){delete bucket[id];return}
      if(!e.d)e.d=e.t?iso(new Date(e.t)):k;
      if(e.d!==k){
        S.done[e.d]=S.done[e.d]||{};
        if(!S.done[e.d][id])S.done[e.d][id]=e;
        delete bucket[id];
      }
    });
    if(!Object.keys(bucket).length&&S.done[k])delete S.done[k];
  });
}
norm();

function conc(c){return c.mode==="liquid"?(+c.mgPerMl||0):(c.vialMg&&c.bacMl?c.vialMg/c.bacMl:0)}
function unitsFor(c,mg){var k=conc(c);return k>0?mg/k*100:0}
function mlFor(c,mg){var k=conc(c);return k>0?mg/k:0}
function dosesLeft(c){var k=conc(c);if(!k||!c.doseMg)return null;return Math.floor((c.remainingMl||0)/mlFor(c,c.doseMg))}
function concLabel(c){
  if(c.mode==="liquid")return c.mgPerMl?n2(c.mgPerMl)+" mg/mL":"set mg/mL";
  var k=conc(c);return k>0?n2(k)+" mg/mL from "+n2(c.vialMg)+" mg/"+n2(c.bacMl)+" mL":"set vial and water";
}

function occurs(c,ds){
  if(c.paused||c.freq==="prn"||c.freq==="off")return false;
  if(!c.start)return false;
  var a=pd(c.start),b=pd(ds);
  if(b<a)return false;
  var diff=Math.round((b-a)/864e5);
  if(c.freq==="daily")return true;
  if(c.freq==="eod")return diff%2===0;
  if(c.freq==="2xw")return (c.days||[]).indexOf(b.getDay())>-1;
  if(c.freq==="weekly")return b.getDay()===a.getDay();
  if(c.freq==="once")return diff===0;
  return false;
}
function isDone(ds,id){var e=S.done[ds]&&S.done[ds][id];if(!e)return false;return e.d?e.d===ds:true}
function isSkip(ds,id){return (S.skips[ds]||[]).indexOf(id)>-1}

function logDose(id,ds,mg){
  var c=S.compounds.find(function(x){return x.id===id});if(!c)return false;
  var dmg=(mg!=null&&+mg>0)?+mg:c.doseMg;
  if(!dmg||dmg<=0)return false;
  if(isDone(ds,id)){
    var old=S.done[ds][id];
    c.remainingMl=Math.max(0,(c.remainingMl||0)+mlFor(c,old.mg||c.doseMg)-mlFor(c,dmg));
    S.done[ds][id]={t:old.t,d:ds,mg:dmg,units:n2(unitsFor(c,dmg))};
    save();return true;
  }
  S.done[ds][id]={t:Date.now(),d:ds,units:n2(unitsFor(c,dmg)),mg:dmg};
  c.remainingMl=Math.max(0,(c.remainingMl||0)-mlFor(c,dmg));
  S.skips[ds]=(S.skips[ds]||[]).filter(function(x){return x!==id});
  save();return true;
}
function undoDose(id,ds){
  var c=S.compounds.find(function(x){return x.id===id});
  if(S.done[ds]&&S.done[ds][id]){
    var r=S.done[ds][id];
    if(c)c.remainingMl=(c.remainingMl||0)+mlFor(c,r.mg||c.doseMg);
    delete S.done[ds][id];save();
  }
}
function moveDose(id,from,to){
  if(!from||!to||from===to)return;
  var e=S.done[from]&&S.done[from][id];if(!e)return;
  S.done[to]=S.done[to]||{};
  if(!S.done[to][id])S.done[to][id]={t:e.t,d:to,mg:e.mg,units:e.units};
  delete S.done[from][id];
  S.skips[from]=(S.skips[from]||[]).filter(function(x){return x!==id});
  save();
}
function toggleSkip(id,ds){
  var a=S.skips[ds]=S.skips[ds]||[];
  var i=a.indexOf(id);
  if(i>-1)a.splice(i,1);else a.push(id);
  save();
}

var tab=(location.hash||"#today").slice(1);
window.addEventListener("hashchange",function(){tab=(location.hash||"#today").slice(1);render()});

function head(title,sub){return '<header><h1>'+esc(title)+'</h1><div class="sub">'+esc(sub)+'</div></header>'}
function doseLine(c,mg){
  var u=unitsFor(c,mg);
  if(!u)return n2(mg)+' mg · no concentration';
  return n2(mg)+' mg · '+n2(u)+' u · '+n2(mlFor(c,mg))+' mL';
}
function timeChip(t,prn){
  if(prn)return '<span class="timechip prn">PRN</span>';
  if(!t)return '<span class="timechip any">any time</span>';
  return '<span class="timechip">'+esc(t)+'</span>';
}
function doseBtn(c,ds,mg){
  if(!conc(c))return '<button class="dose warn" data-edit="'+c.id+'">'+n2(mg)+' mg · tap to set concentration</button>';
  return '<button class="dose" data-dose="'+c.id+'|'+ds+'">'+doseLine(c,mg)+'</button>';
}

function viewToday(){
  var d=today();
  var due=S.compounds.filter(function(c){return occurs(c,d)&&!isDone(d,c.id)&&!isSkip(d,c.id)});
  var done=S.compounds.filter(function(c){return isDone(d,c.id)});
  var skipped=S.compounds.filter(function(c){return isSkip(d,c.id)&&!isDone(d,c.id)});
  var total=due.length+done.length+skipped.length;
  var off=S.compounds.filter(function(c){return !occurs(c,d)&&!c.paused&&c.freq!=="prn"&&c.freq!=="off"});
  function byTime(a,b){return (a.time||"99:99").localeCompare(b.time||"99:99")}
  due.sort(byTime);done.sort(byTime);skipped.sort(byTime);

  var h=head("Today",new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}));
  h+='<main>';
  h+='<div class="card"><div class="row" style="border:0;padding:0"><div class="nm"><div class="l1"><b class="mono">'+done.length+' of '+total+'</b></div><div class="l2">doses logged today</div></div><span class="pill '+(done.length===total&&total>0?"ok":"")+'">'+(total?Math.round(done.length/total*100):0)+'%</span></div></div>';

  if(!total)h+='<div class="card"><div class="dim">Nothing scheduled. Add one below or use a one-off.</div></div>';

  if(due.length||skipped.length||done.length){
    h+='<div class="card"><h2>Doses</h2>';
    due.forEach(function(c){
      h+='<div class="row"><div class="chk" data-log="'+c.id+'">✓</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b>'+timeChip(c.time,false)+'</div><div class="l2">'+doseBtn(c,d,c.doseMg)+'</div></div><button class="skip" data-skip="'+c.id+'">Skip</button></div>';
    });
    skipped.forEach(function(c){
      h+='<div class="row struck"><div class="chk sk" data-log="'+c.id+'">–</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b>'+timeChip(c.time,false)+'</div><div class="l2">'+doseBtn(c,d,c.doseMg)+'</div></div><button class="skip on" data-skip="'+c.id+'">Unskip</button></div>';
    });
    done.forEach(function(c){
      var r=S.done[d][c.id]||{};
      h+='<div class="row done"><div class="chk on" data-undo="'+c.id+'">✓</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b>'+timeChip(c.time,false)+'</div><div class="l2">'+doseBtn(c,r.mg||c.doseMg,d)+' · logged '+hhmm(r.t||Date.now())+'</div></div><button class="skip" data-skip="'+c.id+'">Skip</button></div>';
    });
    h+='</div>';
  }

  h+=viewMedsToday();

  h+='<div class="card"><h2>Backdate a dose</h2><div class="dim" style="margin-bottom:8px">For something you already took on another day.</div>';
  h+='<label>Compound</label><select id="bdSel">'+S.compounds.filter(function(c){return c.freq!=="prn"}).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")+'</select>';
  h+='<div class="grid2"><div><label>Date</label><input type="date" id="bdDate" value="'+addDays(d,-1)+'" max="'+d+'"></div><div><label>Dose (mg)</label><input id="bdDose" type="number" step="0.01" inputmode="decimal"></div></div>';
  h+='<div class="tiny" id="bdOut" style="margin-top:6px"></div>';
  h+='<div style="margin-top:10px"><button class="btn" id="bdGo">Log it</button></div></div>';

  h+='<div class="card"><h2>One-off injection</h2><div class="dim" style="margin-bottom:8px">Not on the schedule at all. Shows once, never recurs.</div>';
  h+='<label>Name</label><input id="ooName" placeholder="e.g. TB-500 2 mg">';
  h+='<div class="grid2"><div><label>Date</label><input type="date" id="ooDate" value="'+d+'"></div><div><label>Dose (mg)</label><input id="ooMg" type="number" step="0.01" inputmode="decimal"></div></div>';
  h+='<div style="margin-top:10px"><button class="btn alt" id="ooGo">Add one-off</button></div></div>';

  if(off.length){
    h+='<div class="card"><h2>Not scheduled today</h2>';
    off.forEach(function(c){
      h+='<div class="row"><div class="chk" data-log="'+c.id+'">✓</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b></div><div class="l2">'+esc(c.freq)+' · '+doseBtn(c,d,c.doseMg)+'</div></div></div>';
    });
    h+='</div>';
  }
  h+='</main>';
  return h;
}

function medSlots(){
  var out=[];
  S.meds.forEach(function(m,i){
    if(!m.times||!m.times.length){out.push({i:i,m:m,t:""});return}
    m.times.slice().sort().forEach(function(t){out.push({i:i,m:m,t:t})});
  });
  out.sort(function(a,b){return (a.t||"99:99").localeCompare(b.t||"99:99")});
  return out;
}
function medKey(m,t){return m.n+"@"+(t||"any")}
function isMedDone(ds,k){return !!(S.medLog[ds]&&S.medLog[ds][k])}
function viewMedsToday(){
  if(!S.meds.length)return "";
  var d=today(),slots=medSlots();
  var dn=slots.filter(function(s){return isMedDone(d,medKey(s.m,s.t))}).length;
  var h='<div class="card"><h2>Medications</h2><div class="tiny" style="margin-bottom:6px">'+dn+' of '+slots.length+' logged</div>';
  slots.forEach(function(s){
    var k=medKey(s.m,s.t),done=isMedDone(d,k);
    var prn=!s.t;
    h+='<div class="row'+(done?" done":"")+'"><div class="chk'+(done?" on":"")+'" data-med="'+esc(k)+'">✓</div><div class="nm"><div class="l1"><b>'+esc(s.m.n)+'</b>'+timeChip(s.t,prn)+'</div><div class="l2">'+esc(s.m.dose||"")+'</div></div></div>';
  });
  h+='</div>';
  return h;
}

function viewCal(){
  var base=S.calMonth?pd(S.calMonth+"-01"):pd(today());
  base.setDate(1);
  var y=base.getFullYear(),m=base.getMonth();
  var first=new Date(y,m,1),start=new Date(first);start.setDate(1-first.getDay());
  var h='<div class="card"><h2>'+base.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</h2>';
  h+='<div class="cal">'+DOW.map(function(x){return '<div class="hd">'+x[0]+'</div>'}).join("");
  for(var i=0;i<42;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);
    var ds=iso(d),out=d.getMonth()!==m,tod=ds===today();
    var n=S.compounds.filter(function(c){return occurs(c,ds)}).length;
    var one=S.oneoff.filter(function(o){return o.date===ds}).length;
    h+='<div class="d'+(out?" out":"")+(tod?" tod":"")+'" data-day="'+ds+'">'+d.getDate()+(n||one?'<div class="dot'+(one?" p":"")+'"></div>':'')+'</div>';
  }
  h+='</div><div class="grid2" style="margin-top:10px"><button class="btn alt sm" id="calPrev">Prev</button><button class="btn alt sm" id="calNext">Next</button></div></div>';
  if(S.calDay){
    var ds2=S.calDay;
    h+='<div class="card"><h2>'+esc(pd(ds2).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}))+'</h2>';
    var items=S.compounds.filter(function(c){return occurs(c,ds2)});
    if(!items.length)h+='<div class="dim">Nothing scheduled.</div>';
    items.forEach(function(c){
      var dn=isDone(ds2,c.id),r=dn?(S.done[ds2][c.id]||{}):null;
      h+='<div class="row'+(dn?" done":"")+'"><div class="chk'+(dn?" on":"")+'" data-logday="'+c.id+'|'+ds2+'">✓</div><div class="nm"><div class="l1"><b>'+esc(c.name)+'</b>'+timeChip(c.time,false)+'</div><div class="l2">'+doseBtn(c,ds2,dn&&r.mg?r.mg:c.doseMg)+'</div></div></div>';
    });
    S.oneoff.filter(function(o){return o.date===ds2}).forEach(function(o){
      h+='<div class="row"><div class="nm"><div class="l1"><b>'+esc(o.name)+'</b><span class="pill">one-off'+(o.mg?" · "+n2(o.mg)+" mg":"")+'</span></div></div><button class="skip" data-deloo="'+o.id+'">×</button></div>';
    });
    h+='</div>';
  }
  return h;
}

  if(S.meds.some(function(m){return /doxy/i.test(m.n)}))R.push(["warn","Doxycycline chelates minerals","Keep calcium, magnesium, iron and dairy 2 h away. 10:00 isolated window."]);

  var v;
  if(tab==="today")v=viewToday();
  else if(tab==="body")v=viewBody();
  else if(tab==="labs")v=viewLabs();
  else if(tab==="sites")v=viewSites();
  else if(tab==="inv")v=viewInv();
  else if(tab==="storage")v=viewStorage();
  else if(tab==="meds")v=viewMeds();
  else if(tab==="conf")v=viewConf();
  else if(tab==="sync")v=viewSync();

  else v=viewMore();

  Array.prototype.forEach.call(document.querySelectorAll("nav a"),function(a){
    a.className=(a.getAttribute("href")==="#"+tab)?"on":"";

function modal(html){
  closeModal();
  var w=document.createElement("div");
  w.className="modal";w.id="mdl";
  w.innerHTML='<div class="sheet">'+html+'</div>';
  document.body.appendChild(w);
}
function closeModal(){var m=document.getElementById("mdl");if(m)m.remove()}

function doseModal(id,ds){
  var c=S.compounds.find(function(x){return x.id===id});if(!c)return;
  var logged=isDone(ds,id);
  var cur=logged?(S.done[ds][id].mg||c.doseMg):c.doseMg;
  var html='<h3>'+esc(c.name)+'</h3><div class="dim">'+(ds===today()?"Today":esc(ds))+' · default '+n2(c.doseMg)+' mg · '+esc(concLabel(c))+'</div><label>Dose (mg)</label><input id="dm" type="number" step="0.01" inputmode="decimal" value="'+n2(cur)+'"><div class="tiny" id="dout" style="margin-top:6px"></div><div style="height:12px"></div><button class="btn" id="dgo">'+(logged?"Update logged dose":"Log it")+'</button><div style="height:8px"></div><button class="btn alt" id="ddef">Reset to '+n2(c.doseMg)+' mg</button>';
  if(logged){
    html+='<div style="height:12px"></div><label>Move to a different date</label><div class="grid2"><input id="dmv" type="date" value="'+ds+'"><button class="btn alt" id="dmvgo">Move</button></div>';
  }
  html+='<div style="height:8px"></div><button class="btn alt" id="dcancel">Cancel</button>';
  modal(html);
  function upd(){
    var v=+document.getElementById("dm").value||0;
    document.getElementById("dout").textContent=v>0?(n2(unitsFor(c,v))+" units · "+n2(mlFor(c,v))+" mL"):"enter a dose";
  }
  document.getElementById("dm").oninput=upd;upd();
  document.getElementById("dgo").onclick=function(){
    var v=+document.getElementById("dm").value;
    if(!v||v<=0)return;
    logDose(id,ds,v);closeModal();render();
  };
  document.getElementById("ddef").onclick=function(){document.getElementById("dm").value=n2(c.doseMg);upd()};
  document.getElementById("dcancel").onclick=closeModal;
  if(logged)document.getElementById("dmvgo").onclick=function(){
    var to=document.getElementById("dmv").value;
    if(!to)return;
    moveDose(id,ds,to);closeModal();render();
  };
}

function bind(){
  function q(s){return document.querySelector(s)}
  document.querySelectorAll("[data-log]").forEach(function(el){
    el.onclick=function(){
      var id=el.getAttribute("data-log");
      if(isDone(today(),id)){undoDose(id,today())}else{logDose(id,today())}
      render();
    };
  });
  document.querySelectorAll("[data-undo]").forEach(function(el){
    el.onclick=function(){undoDose(el.getAttribute("data-undo"),today());render()};
  });
  document.querySelectorAll("[data-skip]").forEach(function(el){
    el.onclick=function(){toggleSkip(el.getAttribute("data-skip"),today());render()};
  });
  document.querySelectorAll("[data-dose]").forEach(function(el){
    el.onclick=function(){var p=el.getAttribute("data-dose").split("|");doseModal(p[0],p[1])};
  });
  document.querySelectorAll("[data-med]").forEach(function(el){
    el.onclick=function(){
      var k=el.getAttribute("data-med"),d=today();
      S.medLog[d]=S.medLog[d]||{};
      if(S.medLog[d][k])delete S.medLog[d][k];else S.medLog[d][k]=Date.now();
      save();render();
    };
  });
  document.querySelectorAll("[data-logday]").forEach(function(el){
    el.onclick=function(){
      var p=el.getAttribute("data-logday").split("|");
      if(isDone(p[1],p[0]))undoDose(p[0],p[1]);else logDose(p[0],p[1]);
      render();
    };
  });
  document.querySelectorAll("[data-day]").forEach(function(el){
    el.onclick=function(){S.calDay=el.getAttribute("data-day");save();render()};
  });
  document.querySelectorAll("[data-deloo]").forEach(function(el){
    el.onclick=function(){S.oneoff=S.oneoff.filter(function(o){return o.id!==el.getAttribute("data-deloo")});save();render()};
  });
  document.querySelectorAll("[data-delst]").forEach(function(el){
    el.onclick=function(){S.storage.splice(+el.getAttribute("data-delst"),1);save();render()};
  });
  document.querySelectorAll("[data-delmed]").forEach(function(el){
    el.onclick=function(){S.meds.splice(+el.getAttribute("data-delmed"),1);save();render()};
  });
  document.querySelectorAll("[data-site]").forEach(function(el){
    el.onclick=function(){
      var n=el.getAttribute("data-site");
      S.sites.forEach(function(s){if(s.n===n)s.last=today()});
      save();render();
    };
  });
  document.querySelectorAll("[data-lab]").forEach(function(el){
    el.onclick=function(){
      var n=el.getAttribute("data-lab");
      modal('<h3>'+esc(n)+'</h3><label>Value</label><input id="lv"><label>Date</label><input id="ld" type="date" value="'+today()+'"><div style="height:10px"></div><button class="btn" id="lgo">Save</button> <button class="btn alt" id="lcancel">Cancel</button>');
      document.getElementById("lgo").onclick=function(){
        var l=S.labs.find(function(x){return x.n===n});
        if(l){l.v.push({val:document.getElementById("lv").value,date:document.getElementById("ld").value});save()}
        closeModal();render();
      };
      document.getElementById("lcancel").onclick=closeModal;
    };
  });
  document.querySelectorAll("[data-edit]").forEach(function(el){
    el.onclick=function(){editCompound(el.getAttribute("data-edit"))};
  });

  if(q("#bdSel")){
    var updBd=function(){
      var c=S.compounds.find(function(x){return x.id===q("#bdSel").value});
      if(!c)return;
      q("#bdDose").value=n2(c.doseMg);
      q("#bdOut").textContent=conc(c)?(n2(unitsFor(c,c.doseMg))+" units · "+n2(mlFor(c,c.doseMg))+" mL"):"no concentration set";
    };
    q("#bdSel").onchange=updBd;updBd();
    q("#bdDose").oninput=function(){
      var c=S.compounds.find(function(x){return x.id===q("#bdSel").value});
      if(!c)return;
      var v=+q("#bdDose").value||0;
      q("#bdOut").textContent=v>0?(n2(unitsFor(c,v))+" units · "+n2(mlFor(c,v))+" mL"):"enter a dose";
    };
    q("#bdGo").onclick=function(){
      var id=q("#bdSel").value,ds=q("#bdDate").value,mg=+q("#bdDose").value;
      if(!id||!ds)return;
      if(!logDose(id,ds,mg)){render();return}
      var c=S.compounds.find(function(x){return x.id===id});
      render();
      if(ds!==today()&&c&&occurs(c,today())&&!isDone(today(),id)&&!isSkip(today(),id)){
        modal('<h3>'+esc(c.name)+'</h3><div class="dim">Logged on '+esc(ds)+'. It is also scheduled today. Skip today\'s or keep both?</div><div style="height:12px"></div><button class="btn" id="mSkip">Skip today\'s</button><div style="height:8px"></div><button class="btn alt" id="mKeep">Keep both</button>');
        document.getElementById("mSkip").onclick=function(){toggleSkip(id,today());closeModal();render()};
        document.getElementById("mKeep").onclick=closeModal;
      }
    };
  }

  if(q("#ooGo"))q("#ooGo").onclick=function(){
    var n=q("#ooName").value.trim();if(!n)return;
    S.oneoff.push({id:uid(),name:n,date:q("#ooDate").value||today(),mg:+q("#ooMg").value||null});
    save();render();
  };
  if(q("#bSave"))q("#bSave").onclick=function(){
    var w=parseFloat(q("#bW").value),wa=parseFloat(q("#bWaist").value);
    if(!w&&!wa)return;
    var d=today(),ex=S.body.find(function(b){return b.date===d});
    if(ex){if(w)ex.w=w;if(wa)ex.waist=wa}
    else S.body.push({date:d,w:w||null,waist:wa||null});
    save();render();
  };
  if(q("#calPrev"))q("#calPrev").onclick=function(){
    var b=pd((S.calMonth||today().slice(0,7))+"-01");b.setMonth(b.getMonth()-1);
    S.calMonth=iso(b).slice(0,7);save();render();
  };
  if(q("#calNext"))q("#calNext").onclick=function(){
    var b=pd((S.calMonth||today().slice(0,7))+"-01");b.setMonth(b.getMonth()+1);
    S.calMonth=iso(b).slice(0,7);save();render();
  };
  if(q("#ncMode"))q("#ncMode").onchange=function(){
    var liq=q("#ncMode").value==="liquid";
    q("#ncPow").style.display=liq?"none":"block";
    q("#ncLiq").style.display=liq?"block":"none";
  };
  if(q("#ncAdd"))q("#ncAdd").onclick=function(){
    var n=q("#ncName").value.trim();if(!n)return;
    var mode=q("#ncMode").value;
    var c={id:uid(),name:n,n:n,mode:mode,doseMg:+q("#ncDose").value||0,time:q("#ncTime").value||"",freq:q("#ncFreq").value,days:q("#ncFreq").value==="2xw"?[1,4]:[],start:today(),route:"subq"};
    if(mode==="liquid"){c.mgPerMl=+q("#ncConc").value||0;c.vialMl=+q("#ncVml").value||1;c.remainingMl=c.vialMl;if(!c.mgPerMl)c.needConc=true}
    else{c.vialMg=+q("#ncMg").value||0;c.bacMl=+q("#ncBac").value||1;c.remainingMl=c.bacMl}
    S.compounds.push(c);save();render();
  };
  if(q("#stAdd"))q("#stAdd").onclick=function(){
    var n=q("#stN").value.trim();if(!n)return;
    S.storage.push({n:n,qty:+q("#stQ").value||null,unit:q("#stU").value||""});
    save();render();
  };
  if(q("#mdAdd"))q("#mdAdd").onclick=function(){
    var n=q("#mdN").value.trim();if(!n)return;
    S.meds.push({n:n,name:n,dose:q("#mdD").value,times:q("#mdT").value.split(",").map(function(x){return x.trim()}).filter(Boolean)});
    save();render();
  };
  if(q("#syPush"))q("#syPush").onclick=async function(){
    var t=q("#syT").value.trim(),g=q("#syG").value.trim();
    localStorage.setItem(SKEY,JSON.stringify({token:t,gistId:g,last:new Date().toLocaleString()}));
    if(!t||!g)return alert("Token and gist ID required");
    var r=await fetch("https://api.github.com/gists/"+g,{method:"PATCH",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({files:{"stack.json":{content:JSON.stringify(S)}}})});
    alert(r.ok?"Pushed.":"Push failed: "+r.status);render();
  };
  if(q("#syPull"))q("#syPull").onclick=async function(){
    var t=q("#syT").value.trim(),g=q("#syG").value.trim();
    localStorage.setItem(SKEY,JSON.stringify({token:t,gistId:g,last:new Date().toLocaleString()}));
    if(!t||!g)return alert("Token and gist ID required");
    var r=await fetch("https://api.github.com/gists/"+g,{headers:{Authorization:"Bearer "+t}});
    if(!r.ok)return alert("Pull failed: "+r.status);
    var j=await r.json(),f=j.files["stack.json"];
    if(!f)return alert("No stack.json in gist");
    S=JSON.parse(f.content);norm();save();alert("Pulled.");render();
  };
  if(q("#syNew"))q("#syNew").onclick=async function(){
    var t=q("#syT").value.trim();if(!t)return alert("Token required");
    var r=await fetch("https://api.github.com/gists",{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({description:"Stack backup",public:false,files:{"stack.json":{content:JSON.stringify(S)}}})});
    if(!r.ok)return alert("Failed: "+r.status);
    var j=await r.json();
    localStorage.setItem(SKEY,JSON.stringify({token:t,gistId:j.id,last:new Date().toLocaleString()}));
    alert("Gist created.");render();
  };
  if(q("#syForget"))q("#syForget").onclick=function(){localStorage.removeItem(SKEY);render()};
  if(q("#tForce"))q("#tForce").onclick=async function(){
    if("caches" in window){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k)}))}
    var rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(function(r){return r.unregister()}));
    location.reload(true);
  };
  if(q("#tClear"))q("#tClear").onclick=function(){
    var d=today();
    Object.keys(S.done[d]||{}).forEach(function(id){
      var c=S.compounds.find(function(x){return x.id===id});
      if(c)c.remainingMl=(c.remainingMl||0)+mlFor(c,(S.done[d][id]||{}).mg||c.doseMg);
    });
    delete S.done[d];delete S.skips[d];delete S.medLog[d];
    save();render();
  };
  if(q("#tExport"))q("#tExport").onclick=function(){
    var b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="stack-"+today()+".json";a.click();
  };
  if(q("#tImport"))q("#tImport").onclick=function(){
    var i=document.createElement("input");i.type="file";i.accept=".json";
    i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{S=JSON.parse(r.result);norm();save();render()}catch(e){alert("Bad file")}};r.readAsText(f)};
    i.click();
  };
}

function editCompound(id){
  var c=S.compounds.find(function(x){return x.id===id});if(!c)return;
  var liq=c.mode==="liquid";
  modal('<h3>'+esc(c.name)+'</h3>'+
    '<label>Type</label><select id="eMode"><option value="powder"'+(liq?"":" selected")+'>powder vial</option><option value="liquid"'+(liq?" selected":"")+'>pre-mixed liquid</option></select>'+
    '<div id="ePow" style="display:'+(liq?"none":"block")+'"><div class="grid2"><div><label>Vial mg</label><input id="eV" type="number" step="0.1" value="'+(c.vialMg||"")+'"></div><div><label>BAC mL</label><input id="eB" type="number" step="0.1" value="'+(c.bacMl||"")+'"></div></div></div>'+
    '<div id="eLiq" style="display:'+(liq?"block":"none")+'"><div class="grid2"><div><label>mg per mL</label><input id="eC" type="number" step="0.1" value="'+(c.mgPerMl||"")+'"></div><div><label>Vial mL</label><input id="eVm" type="number" step="0.1" value="'+(c.vialMl||"")+'"></div></div></div>'+
    '<div class="grid2"><div><label>Dose mg</label><input id="eD" type="number" step="0.01" value="'+c.doseMg+'"></div><div><label>Time</label><input id="eT" type="time" value="'+esc(c.time||"")+'"></div></div>'+
    '<label>Frequency</label><select id="eF">'+["daily","eod","2xw","weekly","prn","off"].map(function(f){return '<option value="'+f+'"'+(c.freq===f?" selected":"")+'>'+f+'</option>'}).join("")+'</select>'+
    '<label>Start date</label><input id="eS" type="date" value="'+esc(c.start)+'">'+
    '<label>Site</label><input id="eP" value="'+esc(c.site||"")+'">'+
    '<div style="height:12px"></div><button class="btn" id="eSave">Save</button><div style="height:8px"></div><button class="btn alt" id="ePause">'+(c.paused?"Resume":"Pause")+'</button><div style="height:8px"></div><button class="btn bad" id="eDel">Delete</button>');
  document.getElementById("eMode").onchange=function(){
    var l=this.value==="liquid";
    document.getElementById("ePow").style.display=l?"none":"block";
    document.getElementById("eLiq").style.display=l?"block":"none";
  };
  document.getElementById("eSave").onclick=function(){
    c.mode=document.getElementById("eMode").value;
    c.doseMg=+document.getElementById("eD").value||0;
    c.time=document.getElementById("eT").value||"";
    c.freq=document.getElementById("eF").value;c.start=document.getElementById("eS").value;c.site=document.getElementById("eP").value;
    if(c.mode==="liquid"){
      c.mgPerMl=+document.getElementById("eC").value||0;
      var vm=+document.getElementById("eVm").value||0;
      if(vm&&vm!==c.vialMl){c.vialMl=vm;c.remainingMl=vm}
      if(!c.vialMl)c.vialMl=1;
      if(c.mgPerMl)c.needConc=false;
    }else{
      c.vialMg=+document.getElementById("eV").value||0;c.bacMl=+document.getElementById("eB").value||1;
    }
    save();closeModal();render();
  };
  document.getElementById("ePause").onclick=function(){c.paused=!c.paused;save();closeModal();render()};
  document.getElementById("eDel").onclick=function(){S.compounds=S.compounds.filter(function(x){return x.id!==id});save();closeModal();render()};
}

render();
</script>
</body>
</html>
